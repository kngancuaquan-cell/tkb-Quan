<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Thời gian biểu của tôi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2b2b45);
      color: #fff;
    }

    h1 {
      text-align: center;
      padding: 20px 10px;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .day {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      margin-bottom: 20px;
      padding: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .day h2 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 20px;
      color: #ffd369;
    }

    .slot {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 10px;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 8px;
      background: rgba(0,0,0,0.25);
      align-items: center;
    }

    .time {
      font-weight: bold;
      color: #4fd1c5;
    }

    .task {
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      font-size: 14px;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .task:focus {
      background: rgba(255,255,255,0.15);
    }

    .footer {
      text-align: center;
      opacity: 0.6;
      font-size: 13px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .slot {
        grid-template-columns: 70px 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>⏰ Thời gian biểu của Quân</h1>
